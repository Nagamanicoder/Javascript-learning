<!-- Lexical scoping determines variable accessibility based on where functions are defined in the source code, 
 allowing inner functions to access outer scope variables. 
 A closure is a function that remembers and accesses this lexical scope
 even after its outer parent function has finished executing.  -->

<!-- Closure behaviuor and its properties -->

<!-- Definition: A closure is a function that retains access to the lexical environment 
where it was created (so the inner function can access outer variables).

Lexical capture: The function captures variables from its surrounding scope 
(e.g., displayName captures name from makeFunc).

Lifetime: Captured bindings stay alive after the outer function 
returns — the environment is retained as long as the closure exists.

By-reference: Closures capture bindings, not immutable snapshots 
they observe the current value of the variable when executed.

Use cases: Data privacy (private variables), function factories, partial application,
 event handlers, and callback state.

Pitfalls: Can cause unintended memory retention or stale/shared state (careful with loops and var); 
prefer let/const and explicit patterns to avoid surprises. -->
